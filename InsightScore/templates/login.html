<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InsightScore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- We will use the Inter font -->
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Main Content Box -->
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="flex justify-center items-center gap-3 mb-6">
            <i data-lucide="trending-up" class="text-purple-500 w-10 h-10"></i>
            <h1 class="text-3xl font-bold text-white">InsightScore</h1>
        </div>
        
        <!-- Main Card -->
        <div class="bg-slate-800/50 border border-slate-700 rounded-2xl shadow-2xl p-8 backdrop-blur-lg">
            
            <!-- Login Form (Default) -->
            <div id="login-form">
                <h2 class="text-2xl font-bold text-center text-white mb-6">Welcome Back</h2>
                <div class="space-y-4">
                    <div>
                        <label for="login-email" class="text-sm font-medium text-slate-400">Email</label>
                        <input type="email" id="login-email" placeholder="you@example.com" class="mt-1 w-full p-3 rounded-lg bg-slate-900 border border-slate-600 focus:border-purple-500 focus:ring-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="login-pass" class="text-sm font-medium text-slate-400">Password</label>
                        <!-- MODIFIED: Added relative positioning -->
                        <div class="relative">
                            <input type="password" id="login-pass" placeholder="••••••••" class="mt-1 w-full p-3 rounded-lg bg-slate-900 border border-slate-600 focus:border-purple-500 focus:ring-purple-500 focus:outline-none pr-10">
                            <!-- NEW: View Password Button -->
                            <button onclick="togglePass('login-pass')" class="absolute right-3 top-1/2 -translate-y-1/2 mt-0.5 text-slate-400 hover:text-white">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <button onclick="loginUser()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold p-3 rounded-lg shadow-lg transition transform active:scale-95">Login</button>
                    <p id="login-error" class="text-sm text-red-400 text-center"></p>
                </div>
                <div class="text-sm text-center text-slate-400 mt-6">
                    <button onclick="toggleView('forgot-form')" class="hover:text-purple-400 transition">Forgot Password?</button>
                    <span class="mx-2 text-slate-600">|</span>
                    <button onclick="toggleView('register-form')" class="hover:text-purple-400 transition">Create Account</button>
                </div>
            </div>

            <!-- Registration Form (Hidden) -->
            <div id="register-form" class="hidden">
                <h2 class="text-2xl font-bold text-center text-white mb-6">Create Account</h2>
                <div class="space-y-4">
                    <input type="text" id="reg-name" placeholder="Full Name" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600">
                    <input type="email" id="reg-email" placeholder="Email Address" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600">
                    <input type="text" id="reg-phone" placeholder="Phone Number" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600">
                    <!-- MODIFIED: Added relative positioning -->
                    <div class="relative">
                        <input type="password" id="reg-pass" placeholder="Create Password" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 pr-10">
                        <!-- NEW: View Password Button -->
                        <button onclick="togglePass('reg-pass')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <button onclick="registerUser()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold p-3 rounded-lg shadow-lg transition">Create Account</button>
                    <p id="reg-error" class="text-sm text-red-400 text-center"></p>
                </div>
                <div class="text-sm text-center text-slate-400 mt-6">
                    <button onclick="toggleView('login-form')" class="hover:text-purple-400 transition">Back to Login</button>
                </div>
            </div>

            <!-- Forgot Password Form (Hidden) -->
            <div id="forgot-form" class="hidden">
                <h2 class="text-2xl font-bold text-center text-white mb-6">Reset Password</h2>
                <div class="space-y-4" id="forgot-step1">
                    <input type="email" id="forgot-email" placeholder="Enter your email" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600">
                    <button onclick="sendOTP()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg shadow-lg transition">Send OTP</button>
                    <p id="forgot-error" class="text-sm text-red-400 text-center"></p>
                </div>
                <div class="space-y-4 hidden" id="forgot-step2">
                    <input type="text" id="forgot-otp" placeholder="Enter OTP" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600">
                    <button onclick="verifyOTP()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold p-3 rounded-lg shadow-lg transition">Verify OTP</button>
                    <p id="otp-error" class="text-sm text-red-400 text-center"></p>
                </div>
                <div class="text-sm text-center text-slate-400 mt-6">
                    <button onclick="toggleView('login-form')" class="hover:text-purple-400 transition">Back to Login</button>
                </div>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center p-4 text-xs text-slate-500 mt-8">
        Made with <span class="text-red-400">❤️</span> by 
        <a href="https://github.com/srijeetcoder" target="_blank" rel="noopener noreferrer" class="font-bold text-slate-400 hover:text-purple-400 transition">
            srijeetcoder
        </a>
    </footer>
    
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='auth.js') }}"></script>
    <script>
        lucide.createIcons();
        function toggleView(showId) {
            ['login-form', 'register-form', 'forgot-form'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(showId).classList.remove('hidden');
        }

        // The togglePass function is now loaded from auth.js
    </script>
</body>
</html>
